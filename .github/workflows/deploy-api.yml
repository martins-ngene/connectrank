name: Deploy API to AWS EC2 (t4g.small) via AWS Systems Manager

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: connectrank-api

jobs:
  test:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt pytest pytest-asyncio anyio

      - name: Execute Pytest Suite
        run: |
          cd apps/api
          pytest tests -v

  deploy:
    name: Build ARM64 Container & Deploy via SSM
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push ARM64 Docker Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 via AWS Systems Manager (SSM)
        if: env.AWS_REGION != ''
        run: |
          echo "=========================================================================="
          echo "Deploying ARM64 Container to EC2 t4g.small via AWS Systems Manager..."
          echo "=========================================================================="

          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          if [ -z "$INSTANCE_ID" ]; then
            echo "⚠️ Warning: EC2_INSTANCE_ID secret not yet configured. Skipping remote host deploy."
            echo "Image successfully built and pushed to ECR: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
            exit 0
          fi

          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPO="${{ env.ECR_REPOSITORY }}"
          REGION="${{ env.AWS_REGION }}"

          DEPLOY_SCRIPT=$(cat <<EOF
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REGISTRY
          docker pull $REGISTRY/$REPO:latest
          docker stop connectrank-api || true
          docker rm connectrank-api || true
          docker run -d --name connectrank-api --restart always -p 8080:8080 \
            -e ENVIRONMENT=production \
            -e PORT=8080 \
            -e CORS_ORIGINS=https://connectrank.flowkeit.com,https://connectrank.pages.dev,https://api.connectrank.flowkeit.com \
            -e SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            -e SENTRY_TRACES_SAMPLE_RATE=0.1 \
            $REGISTRY/$REPO:latest
          sleep 5
          curl -f http://localhost:8080/health || exit 1
          EOF
          )

          echo "Dispatching AWS-RunShellScript via SSM to $INSTANCE_ID..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy connectrank-api ${{ github.sha }}" \
            --parameters "commands=[\"$(echo "$DEPLOY_SCRIPT" | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\"]" \
            --region "$REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "Dispatched SSM Command ID: $COMMAND_ID. Polling execution status..."

          TIMEOUT=180
          ELAPSED=0
          INTERVAL=5

          while [ $ELAPSED -lt $TIMEOUT ]; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --region "$REGION" \
              --query "CommandInvocations[0].Status" \
              --output text)

            echo "[$ELAPSED s] SSM Invocation Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "✅ Remote Docker deployment succeeded on EC2 host!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ Error: SSM command execution $STATUS."
              aws ssm list-command-invocations \
                --command-id "$COMMAND_ID" \
                --details \
                --region "$REGION" \
                --query "CommandInvocations[0].CommandPlugins[0].Output" \
                --output text
              exit 1
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "❌ Error: Deployment timed out waiting for SSM execution."
            exit 1
          fi

          echo "--------------------------------------------------------------------------"
          echo "Verifying live Cloudflare Tunnel endpoint health..."
          HEALTH_URL="https://api.connectrank.flowkeit.com/health"
          if curl --fail --retry 3 --retry-delay 5 -s "$HEALTH_URL"; then
            echo ""
            echo "🎉 Live API verified healthy via Cloudflare Tunnel: $HEALTH_URL"
          else
            echo "⚠️ Public health check returned non-200. Ensure Cloudflare Tunnel routing is active."
          fi

