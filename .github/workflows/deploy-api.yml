name: Deploy API to Amazon ECS Express Mode

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: connectrank-api
  ECS_CLUSTER: default
  ECS_SERVICE: connectrank-api

jobs:
  test:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt pytest pytest-asyncio anyio

      - name: Execute Pytest Suite
        run: |
          cd apps/api
          pytest tests -v

  deploy:
    name: Build AMD64 Container & Deploy ECS
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Rolling ECS Service Update
        run: |
          echo "Triggering zero-downtime deployment for ECS service: ${{ env.ECS_SERVICE }}..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment

      - name: Await ECS Express Mode Canary Rollout & Verify Health
        run: |
          echo "=========================================================================="
          echo "Monitoring Amazon ECS Express Mode Deployment..."
          echo "Note: ECS Express Mode uses a Canary strategy with 3-minute bake times"
          echo "(typical end-to-end steady state duration: 10-12 minutes)."
          echo "=========================================================================="

          CLUSTER="${{ env.ECS_CLUSTER }}"
          SERVICE="${{ env.ECS_SERVICE }}"
          TIMEOUT_SECONDS=1200  # 20-minute safety ceiling
          INTERVAL=20
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT_SECONDS ]; do
            # Extract deployment status using AWS CLI JMESPath query into tab-separated values
            STATUS_LINE=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --region "${{ env.AWS_REGION }}" \
              --query "[services[0].deployments[0].rolloutState, length(services[0].deployments), services[0].deployments[0].desiredCount, services[0].deployments[0].runningCount, services[0].deployments[0].failedTasks]" \
              --output text)

            read -r ROLLOUT NUM_DEPS DESIRED RUNNING FAILED <<< "$STATUS_LINE"

            MINS=$((ELAPSED / 60))
            SECS=$((ELAPSED % 60))
            printf "[%02dm %02ds] RolloutState: %-11s | Active Deployments: %s | Tasks: %s/%s running | Failed: %s\n" \
              "$MINS" "$SECS" "$ROLLOUT" "$NUM_DEPS" "$RUNNING" "$DESIRED" "$FAILED"

            if [ "$ROLLOUT" = "FAILED" ] || [ "$FAILED" -gt 0 ]; then
              echo "❌ Error: ECS deployment failed or encountered failing tasks."
              exit 1
            fi

            if [ "$ROLLOUT" = "COMPLETED" ] && [ "$NUM_DEPS" -eq 1 ] && [ "$RUNNING" -ge "$DESIRED" ]; then
              echo "✅ Amazon ECS Express Mode rollout completed successfully in ${MINS}m ${SECS}s!"
              break
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [ $ELAPSED -ge $TIMEOUT_SECONDS ]; then
            echo "❌ Error: Deployment monitoring exceeded 20-minute timeout ceiling."
            exit 1
          fi

          echo "--------------------------------------------------------------------------"
          echo "Verifying live public endpoint health..."
          HEALTH_URL="https://co-1d40322c1542487a832269d7bbadb532.ecs.us-east-1.on.aws/health"
          curl --fail --retry 5 --retry-delay 5 -s "$HEALTH_URL"
          echo ""
          echo "🎉 Live API verified healthy and operational!"
